# The marketing site's gates. This builds and checks; the host deploys.
#
# ⛔ THIS BUILDS `build:public`, NEVER `build`, AND THE DIFFERENCE IS A LICENSING ONE.
#
# `next build` copies everything in `public/` into `out/`. On a machine that has them — which is
# any developer's machine — that includes `NON-Natural-Grotesk-Regular.woff2`, licensed for
# personal use, and `hydra.svg`, a third party's trademark. **Publishing `out/` redistributes both
# exactly as committing them would, and the build SUCCEEDS while doing it.** The page looks
# correct either way; nothing fails, nothing warns.
#
# `build:public` substitutes the wordmark face with Geist and the mark with `>|<`, and its
# preflight refuses to run at all if either restricted file is present. Those files are gitignored,
# so a CI checkout does not have them — which makes CI the natural place for this build and is why
# the workflow can assert rather than hope.
#
#
# This comment lives here as well as in `web/README.md` because the workflow is what somebody edits
# when a build fails, and `npm run build` is the obvious thing to reach for.
# ⛔ THIS DOES NOT DEPLOY, AND THE GATES STILL MATTER.
#
# The site is hosted on Vercel, so the deploy job that used to live here is gone — it targeted
# GitHub Pages, which was never enabled on this repository and now never will be. **What is left
# is not decoration.** Vercel will happily build and publish the wrong thing: the licensing
# exposure below is a property of `next build` copying `public/`, not of any particular host.
#
# So the same assertions run in two places, deliberately. Here, on every pull request and push, so
# a defect is caught with a red check rather than a live page. And in `vercel.json`'s build
# command, so a deploy that never passed through this workflow still cannot ship a restricted
# asset. `scripts/assert-public.ts` is the single implementation both call.
#
# The one gate that runs HERE ONLY is `check:figures`, because it needs a browser and the host's
# build container is not guaranteed to have one. That is a division of labour, not a skip: it
# refuses to skip where it runs, and where it does not run nothing pretends it did.
name: web

on:
  workflow_dispatch:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    paths: ["web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No lockfile ambiguity: the site's tree is small and pinned, and a resolution that differs
      # from the one tested is a different site.
      - run: npm ci

      # ⛔ THE SITE'S BUILD RUNS THE CLI, SO THE CLI'S DEPENDENCIES ARE THIS JOB'S DEPENDENCIES.
      #
      # `/demo/hydra/` captures `hydra`'s real help output at build time and **refuses to render if
      # what it captured is not recognisably the command list** — a demo of a command surface that
      # might not be the real one is worse than no demo. In a clean checkout the dapp's packages
      # have no `node_modules`, so the capture dies on `Cannot find package '@scure/starknet'`, the
      # guard fires exactly as designed, and `build:public` exits 1.
      #
      # Found by running this whole workflow by hand against a fresh clone before it had ever run
      # on a runner. It has nothing to do with the figure gate; it would have failed the first
      # deploy on its own.
      - name: Install the dapp packages the site's build captures output from
        run: |
          npm ci --prefix ../hydra-dapp/packages/channel
          npm ci --prefix ../hydra-dapp/packages/identity

      # ⛔ NAME THE BROWSER RATHER THAN INHERITING IT.
      #
      # `check:figures` renders the site, and it refuses to skip when no browser is present — the
      # right behaviour, and the reason this step exists. `ubuntu-latest` ships Chrome today, but
      # that is a runner-image detail and not a promise, and the discovery list inside
      # `figure-geometry.ts` should not be doing load-bearing work on the publish path. This fails
      # in thirty seconds with an instruction instead of after a full build with a path list.
      - name: Locate a browser for the figure measurement
        run: |
          for c in "$CHROME_BIN" /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CHROME_PATH=$c" >> "$GITHUB_ENV"
              echo "using $c"
              exit 0
            fi
          done
          echo "::error::no Chrome on this runner. The figure measurement renders the site and"
          echo "::error::must not be skipped. Add a setup step that installs one, or set CHROME_PATH."
          exit 1

      # The restricted assets are gitignored, so a clean checkout must not have them. If one is
      # present the checkout is not clean, and a public build is not safe to make from it.
      - name: Refuse to build from a checkout carrying restricted assets
        run: |
          for f in public/fonts/NON-Natural-Grotesk-Regular.woff2 public/hydra.svg app/icon.svg; do
            if [ -e "$f" ]; then
              echo "::error::$f is present in a CI checkout. It is gitignored and must not be here."
              exit 1
            fi
          done

      # `test/site.test.ts` asserts that the build does not IGNORE type errors — a check on the
      # setting, not on the outcome. Nothing ran `tsc`, so a real error sat in the test file
      # unnoticed. Running it is the difference between "errors are not suppressed" and "there
      # are none".
      - run: npm run typecheck

      - run: npm run build:public

      # ⛔ ASSERT THE MODE, because a workflow that silently falls back to `build` is the exposure
      # with an automation in front of it. Shared with the host's build command — see the header.
      - run: node scripts/assert-public.ts

      # The tests read the built artefact, so they run against exactly what is about to ship.
      - run: node --test test/*.test.ts
        env:
          HYDRA_PUBLIC: "1"

      # ⛔ MEASURE THE PAGE, because everything above this line reads it.
      #
      # The tests and the preflight check strings, provenance markers and imports — and four
      # defects have shipped that were true of the rendered geometry and false of nothing in the
      # markup, with the suite green through all four. This renders every route at four widths and
      # fails on a label that leaves its own viewBox or prints over another.
      #
      # **It must not skip when no browser is present**, and it does not: `figure-geometry.ts`
      # exits non-zero and lists the paths it looked in. A geometry guard that passes quietly on a
      # machine without Chrome converts "nobody measured this" into a green tick, which is the
      # exact failure it exists to answer. If a future runner image drops Chrome, this step goes
      # red and somebody sets CHROME_PATH — that is the intended outcome, not an inconvenience.
      - name: Measure the rendered figures
        run: npm run check:figures
