[package]
name = "hydra_authorship"
version = "0.1.0"
edition = "2024_07"

# The local toolchain, not the pool's. This is our own deployment and shares no ABI
# with `.upstream/packages/privacy` — it must never be built into that workspace.
[dependencies]
starknet = "2.18.0"

[dev-dependencies]
snforge_std = "0.63.0"

# `channel` is a real contract now, so the target is back. It was removed while this package
# held only a pure function, because declaring it then emitted `external contracts not found`.
[[target.starknet-contract]]
sierra = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
