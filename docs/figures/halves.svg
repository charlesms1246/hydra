<svg viewBox="-2 -2 324 154" role="img" aria-label="The contents of a message are sealed and are the smaller problem. What survives encryption — who contacted whom, when, how often — is larger and is what an adversary works from." preserveAspectRatio="xMidYMid meet" fill="rgb(0, 0, 0)" stop-color="rgb(0, 0, 0)" color="rgb(255, 255, 255)" font-family="&quot;NON Natural Grotesk&quot;, ui-sans-serif, system-ui, sans-serif" font-size="16px" font-weight="300" letter-spacing="normal" stroke-width="1px" stroke-dasharray="none" stroke-linecap="butt" text-anchor="start" dominant-baseline="auto" opacity="1" xmlns="http://www.w3.org/2000/svg" width="324" height="154"><rect x="-2" y="-2" width="324" height="154" fill="rgb(0, 0, 0)"/><rect x="4" y="30" width="92" height="62" fill="none" stroke="rgb(110, 110, 110)" stop-color="rgb(0, 0, 0)" color="rgb(255, 255, 255)" font-family="&quot;NON Natural Grotesk&quot;, ui-sans-serif, system-ui, sans-serif" font-size="16px" font-weight="300" letter-spacing="normal" stroke-width="1px" stroke-dasharray="none" stroke-linecap="butt" text-anchor="start" dominant-baseline="auto" opacity="1"/><text x="50" y="58" fill="rgb(255, 255, 255)" text-anchor="middle" stop-color="rgb(0, 0, 0)" color="rgb(255, 255, 255)" font-family="&quot;Geist Mono&quot;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7px" font-weight="300" letter-spacing="0.84px" stroke-width="1px" stroke-dasharray="none" stroke-linecap="butt" dominant-baseline="auto" opacity="1">CONTENT</text><text x="50" y="72" fill="rgb(110, 110, 110)" text-anchor="middle" stop-color="rgb(0, 0, 0)" color="rgb(255, 255, 255)" font-family="&quot;Geist Mono&quot;, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7px" font-weight="300" letter-spacing="0.84px" stroke-width="1px" stroke-dasharray="none" stroke-linecap="butt" dominant-baseline="auto" opacity="1">sealed</text><text x="4" y="108" fill="rgb(74, 74, 74)" text-anchor="start" stop-color="rgb(0, 0, 0)" co